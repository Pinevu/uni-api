name: Create Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release Archive
        run: |
          # 创建临时打包目录
          mkdir -p release_package/static
          
          # 复制核心文件
          cp static/index.html release_package/static/
          cp docker-compose.release.yml release_package/docker-compose.yml
          cp api.yaml release_package/
          
          # 压缩
          tar -czvf release_package.tar.gz -C release_package .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: API HUB Release ${{ github.ref_name }}
          body: |
            ## API HUB 面板更新
            
            ### 部署方式
            1. 下载下方的 `release_package.tar.gz`
            2. 解压后按照 README.md 说明编辑 `api.yaml`
            3. 运行 `docker compose up -d` 启动服务
          files: release_package.tar.gz
