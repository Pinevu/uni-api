name: Create Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release Archive
        run: |
          mkdir -p release_package/static release_package/data
          cp static/index.html release_package/static/
          cp docker-compose.release.yml release_package/docker-compose.yml
          cp api.yaml release_package/
          cp install.sh release_package/
          tar -czvf release_package.tar.gz -C release_package .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: API HUB Release ${{ github.ref_name }}
          body: |
            ## 🚀 API HUB 全量独立发行版 ${{ github.ref_name }}
            
            ### ✨ 核心特性与亮点
            - 🌙 **自适应暗色/明亮模式**（支持 PWA 状态栏完美浸润）；
            - 📱 **移动端免滑动响应式监控**（模型明细流式列表、渠道健康度、IP 来源监控）；
            - 🔑 **纯净版 API Key 模型授权与有效期管理**（彻底剥离额度与金额体系）；
            - 🛡️ **安全登录锁定与敏感密钥脱敏防护**。
            
            ---
            
            ### ⚡ 极速一键全量安装（在任意新 VPS 终端直接执行）
            ```bash
            curl -sSL https://raw.githubusercontent.com/Pinevu/uni-api/main/install.sh | bash
            ```
            
            ### 🐳 手动安装方式
            1. 下载下方的 `release_package.tar.gz`
            2. 解压到 `/opt/uni-api-panel`
            3. 执行 `docker compose up -d` 启动服务
          files: release_package.tar.gz
